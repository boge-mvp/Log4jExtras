[versions]
kotlin = "2.2.0"
log4j = "2.25.2"
disruptor = "3.4.4"
log4jApi = "1.5.0"
jackson = "2.19.1"

[libraries]
disruptor = { module = "com.lmax:disruptor", version.ref = "disruptor" }
# https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-core
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j" }
# https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-slf4j2-impl
log4jSlf4jImpl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
# https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-api-kotlin
log4jApiKotlin = { module = "org.apache.logging.log4j:log4j-api-kotlin", version.ref = "log4jApi" }
jacksonDataFormatYaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jacksonJsonSchema = { module = "com.fasterxml.jackson.module:jackson-module-jsonSchema-jakarta", version.ref = "jackson" }

[bundles]
log4j = ["log4j-core", "log4jSlf4jImpl", "log4jApiKotlin", "disruptor", "jacksonDataFormatYaml"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }