name: 发布到 GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 支持手动触发
    inputs:
      version:
        description: '要发布的版本号 (例如: 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 为 gradlew 添加执行权限
        run: chmod +x gradlew

      - name: 解析版本号
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            PROJECT_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            PROJECT_VERSION=${GITHUB_REF_NAME#v}
          else
            PROJECT_VERSION="1.0.0"
          fi
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_ENV
          echo "Resolved Version: $PROJECT_VERSION"

      - name: 发布到 GitHub Packages
        run: ./gradlew publish -Pversion=${{ env.PROJECT_VERSION }} --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
